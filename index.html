<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>매일 쑈핑! 매쑈! 링크 모음</title>
<style>:root{--ink:#1f2340;--coral:#e8431f;--sun:#ffc933;--cream:#fff7ee;--line:#eadfce;--muted:#5f564b}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--ink);color:#fff;margin:0 -16px;padding:26px 20px 22px;border-radius:0 0 26px 26px}
header .tag{display:inline-block;background:var(--sun);color:var(--ink);font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:999px}
h1{margin:10px 0 4px;font-size:1.75rem;line-height:1.25;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}
.line{margin:0 0 16px;color:#dfe2f5;font-size:1rem}
.notice{margin:0;background:#fff0c2;color:var(--ink);border-left:6px solid var(--sun);border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.5}
.find{margin:22px 0 14px}
.find label.t{display:block;font-weight:800;font-size:1.1rem;margin-bottom:6px}
.find input[type=search]{width:100%;min-height:54px;font:inherit;font-size:1.3rem;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 14px;-webkit-appearance:none;appearance:none}
.find input[type=search]:focus{outline:3px solid var(--coral);outline-offset:2px}
.msg{min-height:1.5em;margin:2px 2px 0;color:var(--coral);font-weight:700;font-size:.95rem}
.hint{margin:6px 2px 0;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;border:0}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.chips span{display:inline-block;min-height:44px;padding:9px 16px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:700}
.chips input:checked+span{background:var(--ink);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
.count{margin:0 2px 8px;color:var(--muted);font-size:.9rem}
ol{list-style:none;margin:0;padding:0}
li.item,div.item{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px}
h2.sec{margin:20px 2px 8px;font-size:1.15rem;font-weight:800}
h2.sec[hidden]{display:none}
.found{margin:0 0 14px}
.found[hidden]{display:none}
.found div.item{background:#fff0c2;outline:3px solid var(--coral)}
.alt{margin:0 2px 8px;font-weight:700}
.altn{display:inline-block;min-height:44px;margin:4px 6px 0 0;padding:9px 14px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);text-decoration:none}
.more{margin:14px 2px 0;color:var(--muted);font-size:.9rem;text-align:center}
li.item[hidden]{display:none}
li.hit{background:#fff0c2;outline:3px solid var(--coral)}
.num{flex:none;min-width:56px;height:56px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:var(--coral);color:#fff;border-radius:14px;font-size:1.6rem;font-weight:800;line-height:1}
.num.long{font-size:1.25rem}
.thumb{flex:none;width:64px;height:64px;object-fit:contain;background:#f6f1e8;border-radius:12px}
.info{min-width:0;flex:1}
.name{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);font-weight:700;font-size:1.05rem;line-height:1.4;text-decoration:none;word-break:keep-all;overflow-wrap:anywhere}
.name::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0}
.name:focus-visible{outline:3px solid var(--coral);outline-offset:4px;border-radius:6px}
.cat{display:block;margin-top:2px;color:var(--muted);font-size:.85rem}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.soldout{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;background:#ece7df;color:var(--muted);font-size:.85rem;font-weight:700}
.ended .num{background:#9a9288}
.ended .name{color:var(--muted)}</style>
</head>
<body>
<div class="wrap">
<header>
<span class="tag">링크 모음</span>
<h1>매일 쑈핑! 매쑈!</h1>
<p class="line">하루 하나, 살림에 도움 되는 정보와 팁을 전해요</p>
<p class="notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
</header>
<div class="find">
<label class="t" for="q">번호로 찾기</label>
<input id="q" type="search" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="영상에서 들은 번호" enterkeyhint="search">
<p class="hint">영상에서 안내한 번호의 상품 정보입니다.</p>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
<div class="found" id="found" hidden></div>

<p class="count" id="cnt">상품 1개</p>
<h2 class="sec">이번 주 영상 상품</h2>
<ol>
<li class="item" id="n2" data-cat="생활"><span class="num">2</span><img class="thumb" src="https://img2a.coupangcdn.com/image/retail/images/2026/04/06/16/1/1b23d043-ce1e-46e9-b7af-f803a16c6132.jpg" alt="" width="64" height="64" loading="lazy" decoding="async" referrerpolicy="no-referrer"><div class="info"><a class="name" href="https://link.coupang.com/re/AFFSDP?lptag=AF1765516&amp;subid=shorts-hub&amp;pageKey=8527004003&amp;itemId=24689455523&amp;vendorItemId=95175775104&amp;traceid=V0-143-8d79f6b2a59883f6&amp;pt=0&amp;slot=2" target="_blank" rel="sponsored noopener">피지 모락셀라 냄새제거 세탁세제 코튼향</a><span class="cat">생활</span></div></li>
</ol>
</div>
<script>(function(){
var q=document.getElementById('q'),msg=document.getElementById('msg'),box=document.getElementById('found'),items=[].slice.call(document.querySelectorAll('li.item')),t=null,w=null,SIZE=200,TOP=2,cache={};
function cat(){var c=document.querySelector('input[name=cat]:checked');return c?c.value:'all'}
function filter(){var c=cat(),n=0;items.forEach(function(li){var show=c==='all'||li.getAttribute('data-cat')===c;li.hidden=!show;if(show)n++});
[].forEach.call(document.querySelectorAll('h2.sec'),function(h){var ol=h.nextElementSibling;h.hidden=!ol||!ol.querySelector('li.item:not([hidden])')});
var cnt=document.getElementById('cnt');if(cnt)cnt.textContent='상품 '+n+'개'}
function mk(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function card(d){var el=mk('div','item'+(d.ended?' ended':''));el.appendChild(mk('span','num'+(d.number>=100?' long':''),d.number));
if(d.image){var im=mk('img','thumb');im.alt='';im.width=64;im.height=64;im.loading='lazy';im.referrerPolicy='no-referrer';im.addEventListener('error',function(){im.style.display='none'});im.src=d.image;el.appendChild(im)}
var info=mk('div','info'),a=mk('a','name',d.name);a.href=d.url;a.target='_blank';a.rel='sponsored noopener';info.appendChild(a);info.appendChild(mk('span','cat',d.category||''));
if(d.ended)info.appendChild(mk('span','soldout','판매 종료'));el.appendChild(info);return el}
function found(d){box.textContent='';box.appendChild(card(d));
if(d.ended&&d.alt&&d.alt.length){var p=mk('p','alt','같은 종류의 다른 상품 번호');d.alt.forEach(function(n){var a=mk('a','altn',n+'번');a.href='#n'+n;p.appendChild(document.createTextNode(' '));p.appendChild(a)});box.appendChild(p)}
box.hidden=false;box.scrollIntoView({block:'center',behavior:'auto'})}
function load(num){var c=Math.floor((num-1)/SIZE);if(cache[c])return Promise.resolve(cache[c]);
return fetch('d/'+('0000'+c).slice(-4)+'.json').then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(s){var j=JSON.parse(s);cache[c]=j;return j})}
function clear(){msg.textContent='';box.hidden=true;items.forEach(function(x){x.classList.remove('hit')})}
function go(num,quiet){clear();var li=document.getElementById('n'+num);
if(li){if(li.hidden){document.getElementById('cat-all').checked=true;filter()}
li.classList.add('hit');var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
li.scrollIntoView({block:'center',behavior:calm?'auto':'smooth'});clearTimeout(t);t=setTimeout(function(){li.classList.remove('hit')},3500);return}
if(num<1||num>TOP){if(!quiet)msg.textContent=num+'번은 아직 없어요';return}
load(num).then(function(j){var d=null;(j.items||[]).forEach(function(x){if(x.number===num)d=x});
if(q&&q.value&&+q.value!==num)return;if(d)found(d);else if(!quiet)msg.textContent=num+'번은 아직 없어요'},
function(){if(!quiet)msg.textContent='지금은 찾지 못했어요. 잠시 뒤에 다시 찾아 주세요'})}
if(q)q.addEventListener('input',function(){var v=q.value.replace(/[^0-9]/g,'');if(v!==q.value)q.value=v;v=v.replace(/^0+/,'');clearTimeout(w);
if(!v){clear();return}var n=+v;if(document.getElementById('n'+n))go(n,false);else w=setTimeout(function(){go(n,false)},350)});
[].forEach.call(document.querySelectorAll('input[name=cat]'),function(r){r.addEventListener('change',filter)});
[].forEach.call(document.querySelectorAll('img.thumb'),function(im){im.addEventListener('error',function(){im.style.display='none'})});
function hash(quiet){var m=/^#n?(\d+)$/.exec(location.hash||'');if(m){if(q&&!quiet)q.value=m[1];go(+m[1],quiet)}}
window.addEventListener('hashchange',function(){hash(false)});hash(true);
})();</script>
</body>
</html>
