<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>매일 쑈핑! 매쑈! 링크 모음</title>
<style>:root{--ink:#1f2340;--coral:#e8431f;--sun:#ffc933;--cream:#fff7ee;--line:#eadfce;--muted:#5f564b}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--ink);color:#fff;margin:0 -16px;padding:26px 20px 22px;border-radius:0 0 26px 26px}
header .tag{display:inline-block;background:var(--sun);color:var(--ink);font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:999px}
h1{margin:10px 0 4px;font-size:1.75rem;line-height:1.25;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}
.line{margin:0 0 16px;color:#dfe2f5;font-size:1rem}
.notice{margin:0;background:#fff0c2;color:var(--ink);border-left:6px solid var(--sun);border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.5}
.find{margin:22px 0 14px}
.find label.t{display:block;font-weight:800;font-size:1.1rem;margin-bottom:6px}
.find input[type=search]{width:100%;min-height:54px;font:inherit;font-size:1.3rem;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 14px;-webkit-appearance:none;appearance:none}
.find input[type=search]:focus{outline:3px solid var(--coral);outline-offset:2px}
.msg{min-height:1.5em;margin:2px 2px 0;color:var(--coral);font-weight:700;font-size:.95rem}
.hint{margin:6px 2px 0;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;border:0}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.chips span{display:inline-block;min-height:44px;padding:9px 16px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:700}
.chips input:checked+span{background:var(--ink);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
.count{margin:0 2px 8px;color:var(--muted);font-size:.9rem}
ol{list-style:none;margin:0;padding:0}
li.item{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px}
li.item[hidden]{display:none}
li.hit{background:#fff0c2;outline:3px solid var(--coral)}
.num{flex:none;min-width:56px;height:56px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:var(--coral);color:#fff;border-radius:14px;font-size:1.6rem;font-weight:800;line-height:1}
.num.long{font-size:1.25rem}
.thumb{flex:none;width:64px;height:64px;object-fit:contain;background:#f6f1e8;border-radius:12px}
.info{min-width:0;flex:1}
.name{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);font-weight:700;font-size:1.05rem;line-height:1.4;text-decoration:none;word-break:keep-all;overflow-wrap:anywhere}
.name::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0}
.name:focus-visible{outline:3px solid var(--coral);outline-offset:4px;border-radius:6px}
.cat{display:block;margin-top:2px;color:var(--muted);font-size:.85rem}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}</style>
</head>
<body>
<div class="wrap">
<header>
<span class="tag">링크 모음</span>
<h1>매일 쑈핑! 매쑈!</h1>
<p class="line">하루 하나, 살림에 도움 되는 정보와 팁을 전해요</p>
<p class="notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
</header>
<div class="find">
<label class="t" for="q">번호로 찾기</label>
<input id="q" type="search" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="영상에서 들은 번호" enterkeyhint="search">
<p class="hint">영상에서 안내한 번호의 상품 정보입니다.</p>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

<p class="empty">아직 올라온 상품이 없어요.</p>
</div>
<script>(function(){
var q=document.getElementById('q'),msg=document.getElementById('msg'),items=[].slice.call(document.querySelectorAll('li.item')),t=null;
function cat(){var c=document.querySelector('input[name=cat]:checked');return c?c.value:'all'}
function filter(){var c=cat(),n=0;items.forEach(function(li){var show=c==='all'||li.getAttribute('data-cat')===c;li.hidden=!show;if(show)n++});
var cnt=document.getElementById('cnt');if(cnt)cnt.textContent='상품 '+n+'개'}
function go(num,quiet){var li=document.getElementById('n'+num);msg.textContent='';items.forEach(function(x){x.classList.remove('hit')});
if(!li){if(!quiet)msg.textContent=num+'번은 아직 없어요';return}
if(li.hidden){document.getElementById('cat-all').checked=true;filter()}
li.classList.add('hit');
var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
li.scrollIntoView({block:'center',behavior:calm?'auto':'smooth'});clearTimeout(t);t=setTimeout(function(){li.classList.remove('hit')},3500)}
if(q)q.addEventListener('input',function(){var v=q.value.replace(/[^0-9]/g,'');if(v!==q.value)q.value=v;v=v.replace(/^0+/,'');
if(!v){msg.textContent='';items.forEach(function(x){x.classList.remove('hit')});return}go(v,false)});
[].forEach.call(document.querySelectorAll('input[name=cat]'),function(r){r.addEventListener('change',filter)});
[].forEach.call(document.querySelectorAll('img.thumb'),function(im){im.addEventListener('error',function(){im.style.display='none'})});
var m=/^#n?(\d+)$/.exec(location.hash||'');if(m)go(m[1],true);
})();</script>
</body>
</html>
